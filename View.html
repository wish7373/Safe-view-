<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Secure Document Viewer</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
body{font-family:Arial,sans-serif;text-align:center;background:#f4f4f9;margin:0;padding:16px}
#wrap{display:none}
canvas{max-width:100%;height:auto;background:#fff;box-shadow:0 4px 8px rgba(0,0,0,.15)}
button{padding:10px 16px;margin:10px 6px;font-size:16px}
#err{color:#c00;font-size:18px;font-weight:bold;margin-top:40px}
</style>
</head>
<body>
<h2>Secure Document Viewer</h2>
<div id="err"></div>
<div id="wrap">
  <div><button id="prev">Previous</button>
  <span><span id="num">1</span> / <span id="count">1</span></span>
  <button id="next">Next</button></div>
  <canvas id="c"></canvas>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const SUPABASE_URL = "https://ttknswttzxzsftowngkr.supabase.co";
const SUPABASE_KEY = "sb_publishable_howesfkFfffCxF1J_QiBTw_xFht3crI";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const err = document.getElementById("err");
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
let pdf = null, page = 1;

function fail(m){ err.textContent = m; document.getElementById("wrap").style.display="none"; }

async function render(n){
  const p = await pdf.getPage(n);
  const base = p.getViewport({scale:1});
  const maxW = Math.min(window.innerWidth-32, 900);
  const vp = p.getViewport({scale: maxW/base.width});
  canvas.width = vp.width; canvas.height = vp.height;
  await p.render({canvasContext:ctx, viewport:vp}).promise;
  document.getElementById("num").textContent = n;
}

document.getElementById("prev").onclick = () => { if(page>1) render(--page); };
document.getElementById("next").onclick = () => { if(pdf && page<pdf.numPages) render(++page); };

(async function(){
  const token = new URLSearchParams(location.search).get("token");
  if(!token) return fail("Invalid or missing link.");

  const {data:rec, error} = await sb.from("secure_links").select("*").eq("token", token).maybeSingle();
  if(error || !rec) return fail("Link not found or expired.");
  if(rec.expires_at && new Date(rec.expires_at) < new Date()) return fail("This link has expired.");
  if(rec.one_time_open && rec.is_viewed) return fail("This document was already viewed (one-time link).");

  if(rec.one_time_open){
    const {error:u} = await sb.from("secure_links").update({is_viewed:true}).eq("token", token);
    if(u) return fail("Could not secure this session.");
  }

  try{
    pdf = await pdfjsLib.getDocument(rec.signed_url).promise;
  }catch(e){
    return fail("Could not load the document.");
  }
  document.getElementById("count").textContent = pdf.numPages;
  document.getElementById("wrap").style.display = "block";
  render(1);
})();
</script>
</body>
</html>
