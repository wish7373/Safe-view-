<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SafeView</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<style>
body{font-family:Arial,sans-serif;background:#0b1020;color:#f5f7ff;margin:0;padding:20px}
.card{max-width:460px;margin:30px auto;background:#141d31;border:1px solid #2a3854;border-radius:16px;padding:22px}
input{width:100%;padding:12px;margin:6px 0 14px;border-radius:8px;border:1px solid #394966;background:#0c1425;color:#fff;box-sizing:border-box}
button{width:100%;padding:12px;margin-top:6px;border:0;border-radius:8px;background:#8aa7ff;color:#0a1224;font-weight:bold;font-size:16px}
button:disabled{opacity:.5}
.msg{margin-top:14px;font-size:14px;color:#a8b5cf;word-break:break-word}
.err{color:#ff9aab}.ok{color:#75ddb2}
</style>
</head>
<body>
<div class="card" id="authCard">
  <h2>🔐 SafeView</h2>
  <label>Email</label><input id="email" type="email" autocomplete="email">
  <label>Password (min 8 characters)</label><input id="password" type="password" autocomplete="current-password">
  <button id="signup">Create account</button>
  <button id="login">Sign in</button>
  <button id="logout" style="display:none">Log out</button>
  <div class="msg" id="authMsg"></div>
</div>

<div class="card">
  <h2>Upload a PDF</h2>
  <p style="font-size:14px;color:#a8b5cf">Only PDF files, max 50 MB. Convert PowerPoint to PDF first.</p>
  <input id="pdf" type="file" accept="application/pdf,.pdf">
  <button id="upload" disabled>Upload PDF</button>
  <div class="msg" id="upMsg">Sign in to enable uploads.</div>
</div>

<script>
const SUPABASE_URL = "https://ttknswttzxzsftowngkr.supabase.co";
const SUPABASE_KEY = "sb_publishable_howesfkFfffCxF1J_QiBTw_xFht3crI";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
let user = null;

function say(id, text, cls){ const e=$(id); e.textContent=text; e.className="msg "+(cls||""); }
function refresh(u){
  user = u;
  $("signup").style.display = u ? "none" : "";
  $("login").style.display  = u ? "none" : "";
  $("logout").style.display = u ? "" : "none";
  $("upload").disabled = !u;
  say("authMsg", u ? "Signed in as "+u.email : "Not signed in.", u?"ok":"");
  say("upMsg", u ? "Choose a PDF and upload." : "Sign in to enable uploads.");
}

sb.auth.getSession().then(({data}) => refresh(data.session ? data.session.user : null));
sb.auth.onAuthStateChange((_e, s) => refresh(s ? s.user : null));

$("signup").onclick = async () => {
  const email=$("email").value.trim(), password=$("password").value;
  if(!email || password.length<8) return say("authMsg","Enter an email and a password of 8+ characters.","err");
  const {data,error} = await sb.auth.signUp({email,password,options:{emailRedirectTo:"https://wish7373.github.io/Safe-view-/"}});
  if(error) return say("authMsg",error.message,"err");
  if(data.session) refresh(data.session.user);
  else say("authMsg","Check your email for a confirmation link, then sign in.","ok");
};
$("login").onclick = async () => {
  const {data,error} = await sb.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});
  if(error) return say("authMsg",error.message,"err");
  refresh(data.user);
};
$("logout").onclick = async () => { await sb.auth.signOut(); refresh(null); };

$("upload").onclick = async () => {
  const file = $("pdf").files[0];
  if(!user) return say("upMsg","Please sign in first.","err");
  if(!file) return say("upMsg","Choose a PDF first.","err");
  if(!/\.pdf$/i.test(file.name) || file.type!=="application/pdf") return say("upMsg","Only PDF files are allowed.","err");
  if(file.size > 50*1024*1024) return say("upMsg","File must be 50 MB or smaller.","err");
  $("upload").disabled = true;
  say("upMsg","Uploading…");
  const path = user.id + "/" + crypto.randomUUID() + ".pdf";
  const {data,error} = await sb.storage.from("private-ppts").upload(path,file,{contentType:"application/pdf",upsert:false});
  if(error){ $("upload").disabled=false; return say("upMsg","Upload failed: "+error.message,"err"); }
  say("upMsg","Upload complete. Opening link settings…","ok");
  setTimeout(()=>{ location.href = "options.html?path=" + encodeURIComponent(data.path); }, 800);
};
</script>
</body>
</html>
