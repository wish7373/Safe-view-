<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Link Settings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<style>
:root{
  --bg:#E9EEEA;
  --card:#FFFFFF;
  --ink:#172033;
  --muted:#5B6678;
  --line:#D5DDD7;
  --vault:#0F6B5C;
  --vault-dark:#0A4F44;
  --vault-tint:#E3F1ED;
  --danger:#B3261E;
  --danger-tint:#FBE9E7;
  --radius:16px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0E1512;
    --card:#17211D;
    --ink:#E8EFEB;
    --muted:#9AA8A1;
    --line:#2A3832;
    --vault:#3FB59F;
    --vault-dark:#5FCDB8;
    --vault-tint:#1B3029;
    --danger:#FF8A80;
    --danger-tint:#3A1F1D;
  }
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{
  margin:0;
  min-height:100vh;
  font-family:"Manrope",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  font-size:16px;
  line-height:1.5;
  color:var(--ink);
  background:
    radial-gradient(900px 400px at 85% -10%, var(--vault-tint), transparent 70%),
    var(--bg);
  display:flex;
  justify-content:center;
  align-items:flex-start;
  padding:48px 20px;
}
.wrap{width:100%;max-width:480px}

/* Header */
.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.badge{
  width:46px;height:46px;border-radius:14px;
  background:var(--vault);color:#fff;
  display:grid;place-items:center;flex:none;
  box-shadow:0 6px 16px rgba(15,107,92,.35);
}
.badge svg{width:24px;height:24px}
h2{
  font-family:"Sora","Manrope",system-ui,sans-serif;
  font-size:24px;line-height:1.2;margin:0;letter-spacing:-.01em;
}
.sub{margin:2px 0 0;color:var(--muted);font-size:14px}

/* Card */
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:24px;
  box-shadow:0 1px 2px rgba(23,32,51,.05),0 12px 32px rgba(23,32,51,.07);
}

/* One-time toggle */
label.toggle{
  display:flex;align-items:center;gap:14px;
  margin:0;padding:14px 16px;
  border:1px solid var(--line);border-radius:12px;
  cursor:pointer;
  transition:border-color .2s, background .2s;
}
label.toggle:has(input:checked){border-color:var(--vault);background:var(--vault-tint)}
label.toggle:has(input:focus-visible){outline:3px solid var(--vault);outline-offset:2px}
.toggle input{position:absolute;opacity:0;width:1px;height:1px}
.switch{
  position:relative;flex:none;width:46px;height:28px;border-radius:999px;
  background:#B8C2BC;transition:background .2s;
}
.switch::after{
  content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);
  transition:transform .2s;
}
.toggle input:checked + .switch{background:var(--vault)}
.toggle input:checked + .switch::after{transform:translateX(18px)}
.toggle-text b{display:block;font-weight:600}
.toggle-text small{display:block;color:var(--muted);font-size:13px;line-height:1.4}

/* Expiry */
label.field{display:block;margin:22px 0 0;font-weight:600;font-size:15px}
label.field small{display:block;color:var(--muted);font-weight:400;font-size:13px;margin:2px 0 8px}
input[type=datetime-local],input[type=text]{
  width:100%;padding:12px 14px;
  font:inherit;color:var(--ink);
  background:var(--card);
  border:1px solid var(--line);border-radius:12px;
  transition:border-color .2s, box-shadow .2s;
}
input[type=datetime-local]:focus,input[type=text]:focus{
  outline:none;border-color:var(--vault);box-shadow:0 0 0 3px var(--vault-tint);
}

/* Buttons */
button{
  display:block;width:100%;
  margin-top:20px;padding:14px 16px;
  font:inherit;font-weight:600;font-size:16px;
  color:#fff;background:var(--vault);
  border:0;border-radius:12px;cursor:pointer;
  box-shadow:0 4px 12px rgba(15,107,92,.3);
  transition:background .2s, transform .1s;
}
button:hover{background:var(--vault-dark)}
button:active{transform:translateY(1px)}
button:focus-visible{outline:3px solid var(--vault);outline-offset:3px}

/* Result area */
#out{margin-top:20px;word-break:break-all;font-size:15px}
#out:empty{display:none;margin:0}
#out:not(.ok):not(.err){color:var(--muted);text-align:center}
#out.err{
  color:var(--danger);background:var(--danger-tint);
  padding:12px 14px;border-radius:12px;border:1px solid var(--danger);
}
#out.ok{
  color:var(--ink);background:var(--vault-tint);
  border:1px solid var(--vault);border-radius:14px;padding:16px;
}
#out.ok p{margin:0 0 10px;color:var(--vault-dark)}
#out.ok input{font-size:14px;background:var(--card)}
#out.ok button{margin-top:10px}

.foot{text-align:center;color:var(--muted);font-size:13px;margin-top:18px}

@media (prefers-reduced-motion: reduce){
  *{transition:none !important}
}
@media (max-width:420px){
  body{padding:28px 14px}
  .card{padding:18px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="badge" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="10.5" width="16" height="10" rx="2.5"/>
        <path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/>
        <circle cx="12" cy="15.5" r="1.2" fill="currentColor"/>
      </svg>
    </div>
    <div>
      <h2>Secure link settings</h2>
      <p class="sub">Choose how your file can be opened.</p>
    </div>
  </div>

  <div class="card">
    <label class="toggle">
      <input type="checkbox" id="oneTime" checked>
      <span class="switch"></span>
      <span class="toggle-text">
        <b>One-time view only</b>
        <small>The link stops working after it is opened once.</small>
      </span>
    </label>

    <label class="field">Link expires at
      <small>Maximum 7 days from now</small>
      <input type="datetime-local" id="expiry">
    </label>

    <button id="gen">Generate secure link</button>
    <div id="out"></div>
  </div>

  <p class="foot">Your file stays private until someone opens the link.</p>
</div>

<script>
const SUPABASE_URL = "https://ttknswttzxzsftowngkr.supabase.co";
const SUPABASE_KEY = "sb_publishable_howesfkFfffCxF1J_QiBTw_xFht3crI";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const out = document.getElementById("out");
const MAX = 7*24*60*60; // seconds

// default expiry: 24 hours from now
(function(){
  const d = new Date(Date.now()+24*3600*1000 - new Date().getTimezoneOffset()*60000);
  document.getElementById("expiry").value = d.toISOString().slice(0,16);
})();

function show(msg, cls){ out.className = cls||""; out.textContent = msg; }

document.getElementById("gen").onclick = async () => {
  const path = new URLSearchParams(location.search).get("path");
  if(!path) return show("File path missing. Upload a PDF from the main page first.","err");

  const {data:s} = await sb.auth.getSession();
  if(!s.session) return show("Please sign in on the main page first.","err");

  const expVal = document.getElementById("expiry").value;
  let expires = expVal ? new Date(expVal) : new Date(Date.now()+24*3600*1000);
  let seconds = Math.floor((expires - Date.now())/1000);
  if(seconds < 60) return show("Expiry must be in the future.","err");
  if(seconds > MAX){ seconds = MAX; expires = new Date(Date.now()+MAX*1000); }

  show("Creating link…");
  const {data:signed, error:e1} = await sb.storage.from("private-ppts").createSignedUrl(path, seconds);
  if(e1) return show("Could not secure file: "+e1.message,"err");

  const token = crypto.randomUUID();
  const {error:e2} = await sb.from("secure_links").insert([{
    token: token,
    file_path: path,
    signed_url: signed.signedUrl,
    one_time_open: document.getElementById("oneTime").checked,
    is_viewed: false,
    expires_at: expires.toISOString(),
    owner_id: s.session.user.id
  }]);
  if(e2) return show("Database error: "+e2.message,"err");

  const link = new URL("view.html?token="+token, location.href).href;
  out.className = "ok";
  out.innerHTML = "<p><b>Your secure link:</b></p>";
  const inp = document.createElement("input");
  inp.type="text"; inp.readOnly=true; inp.value=link;
  const btn = document.createElement("button");
  btn.textContent="Copy link";
  btn.onclick = () => navigator.clipboard.writeText(link).then(()=>btn.textContent="Copied!");
  out.append(inp, btn);
};
</script>
</body>
</html>
